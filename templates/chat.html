<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <link rel="stylesheet" href="/static/css/style.css?v=3">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar for chat history -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button id="newChatBtn" class="new-chat-btn" onclick="createNewChat()">
                    + New Chat
                </button>
            </div>
            <div class="sidebar-content" id="conversationList">
                <!-- Conversations will be loaded here dynamically -->
            </div>
        </div>
        
        <!-- Toggle sidebar button for mobile -->
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
            ☰
        </button>
        
        <!-- Main chat container -->
        <div class="chat-container">
            <div class="chat-header">
                <div>
                    <h1>RAG Chatbot</h1>
                    <p>Ask questions about your documents</p>
                </div>
                <button id="uploadBtn" class="upload-btn" onclick="openUploadModal()">
                    ➕ Add Document
                </button>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be added here dynamically -->
            </div>
            
            <div class="chat-input-container">
                <!-- Image preview area -->
                <div id="imagePreviewArea" class="image-preview-area"></div>
                
                <!-- Text input -->
                <div class="input-wrapper">
                    <textarea 
                        id="questionInput" 
                        placeholder="Type your question or attach a file..."
                        rows="1"
                        onkeydown="handleInputKeydown(event)"
                    ></textarea>
                    <div class="button-group">
                        <button id="attachBtn" class="attach-btn" onclick="openImagePicker()" title="Attach image or PDF">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                            </svg>
                        </button>
                        <button id="sendButton" onclick="sendMessage()">Send</button>
                    </div>
                </div>
                
                <!-- Hidden file input for image and PDF upload -->
                <input 
                    type="file" 
                    id="imageInput" 
                    accept="image/*,.pdf" 
                    onchange="handleImageSelect(event)" 
                    style="display: none;"
                />
            </div>
        </div>
    </div>
    
    <!-- Upload Modal -->
    <div id="uploadModal" class="upload-modal" style="display: none;">
        <div class="upload-modal-content">
            <span class="upload-modal-close" onclick="closeUploadModal()">&times;</span>
            <h2 class="modal-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                Add Document
            </h2>
            
            <!-- Tab Navigation -->
            <div class="upload-tabs">
                <button class="upload-tab active" data-tab="file" onclick="switchTab('file')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" y1="18" x2="12" y2="12"/>
                        <line x1="9" y1="15" x2="15" y2="15"/>
                    </svg>
                    Upload File
                </button>
                <button class="upload-tab" data-tab="text" onclick="switchTab('text')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="16" y1="13" x2="8" y2="13"/>
                        <line x1="16" y1="17" x2="8" y2="17"/>
                        <polyline points="10 9 9 9 8 9"/>
                    </svg>
                    Paste Text
                </button>
            </div>
            
            <!-- File Upload Tab -->
            <div class="tab-content" id="fileTab">
                <p class="upload-hint">Supported formats: PDF, DOCX, PPTX (max 50MB)</p>
                
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" accept=".pdf,.docx,.pptx" onchange="handleFileSelect(event)" style="display: none;">
                    <div class="upload-placeholder" onclick="document.getElementById('fileInput').click()">
                        <div class="upload-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
                                <path d="M12 12v9"/>
                                <path d="m16 16-4-4-4 4"/>
                            </svg>
                        </div>
                        <p>Click to select a file or drag and drop</p>
                    </div>
                </div>
                
                <div id="fileInfo" class="file-info" style="display: none;">
                    <p><strong>Selected:</strong> <span id="fileName"></span></p>
                    <p><strong>Size:</strong> <span id="fileSize"></span></p>
                </div>
                
                <div class="progress-container" id="progressContainer" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="upload-status" id="uploadStatus"></p>
                </div>
                
                <button id="uploadButton" class="upload-submit-btn" onclick="uploadFile()" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    Upload Document
                </button>
            </div>
            
            <!-- Text Input Tab -->
            <div class="tab-content" id="textTab" style="display: none;">
                <p class="upload-hint">Paste your text content directly - it will be processed and indexed like a document</p>
                
                <div class="text-form">
                    <div class="form-group">
                        <label for="textTitle">Title/Name <span class="required">*</span></label>
                        <input type="text" id="textTitle" placeholder="Enter document title" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="textEmail">Your Email <span class="required">*</span></label>
                        <input type="email" id="textEmail" placeholder="your@email.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="textDate">Date</label>
                        <input type="text" id="textDate" readonly>
                    </div>
                    
                    <div class="form-group">
                        <label for="textContent">Content <span class="required">*</span></label>
                        <textarea id="textContent" rows="8" placeholder="Paste your text content here..."></textarea>
                    </div>
                    
                    <div id="textStatus" class="text-status"></div>
                    
                    <button id="textSubmitBtn" class="upload-submit-btn" onclick="submitText()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"/>
                        </svg>
                        Add Text
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/chat.js?v=6"></script>
</body>
</html>
