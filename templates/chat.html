<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chatbot</title>
    <link rel="stylesheet" href="/static/css/style.css?v=4">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar for chat history -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <!-- Mode Switch Toggle -->
                <div class="mode-switch-container">
                    <button id="modeToggle" class="mode-toggle" onclick="toggleChatMode()">
                        <span class="mode-icon document-icon">📄</span>
                        <span class="mode-icon email-icon" style="display: none;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="#0078d4">
                                <path d="M22.65 2H1.35A.85.85 0 0 0 .5 2.85v18.3c0 .47.38.85.85.85h21.3a.85.85 0 0 0 .85-.85V2.85a.85.85 0 0 0-.85-.85zM8.5 18.5l-5 3V6.5l5 3v9zm1.5-8.15l6.42-4.35H3.58l6.42 4.35zM22 20l-5-3v-9l5-3v15z"/>
                            </svg>
                        </span>
                        <span class="mode-label" id="modeLabel">Documents</span>
                    </button>
                </div>
                <button id="newChatBtn" class="new-chat-btn" onclick="createNewChat()">
                    + New Chat
                </button>
            </div>
            <div class="sidebar-content" id="conversationList">
                <!-- Conversations will be loaded here dynamically -->
            </div>
        </div>
        
        <!-- Toggle sidebar button for mobile -->
        <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
            ☰
        </button>
        
        <!-- Main chat container -->
        <div class="chat-container">
            <div class="chat-header">
                <div>
                    <h1 id="chatTitle">RAG Chatbot</h1>
                    <p id="chatSubtitle">Ask questions about your documents</p>
                </div>
                <button id="uploadBtn" class="upload-btn" onclick="openUploadModal()">
                    ➕ Add Document
                </button>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be added here dynamically -->
            </div>
            
            <div class="chat-input-container">
                <!-- Image preview area -->
                <div id="imagePreviewArea" class="image-preview-area"></div>
                
                <!-- Text input -->
                <div class="input-wrapper">
                    <textarea 
                        id="questionInput" 
                        placeholder="Type your question or attach a file..."
                        rows="1"
                        onkeydown="handleInputKeydown(event)"
                    ></textarea>
                    <div class="button-group">
                        <button id="attachBtn" class="attach-btn" onclick="openImagePicker()" title="Attach image or PDF">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                            </svg>
                        </button>
                        <button id="sendButton" onclick="sendMessage()">Send</button>
                    </div>
                </div>
                
                <!-- Hidden file input for image and PDF upload -->
                <input 
                    type="file" 
                    id="imageInput" 
                    accept="image/*,.pdf" 
                    onchange="handleImageSelect(event)" 
                    style="display: none;"
                />
            </div>
        </div>
        
        <!-- Email Panel (right side) -->
        <div class="email-panel" id="emailPanel" style="display: none;">
            <div class="email-panel-header">
                <h3>✉ OUTLOOK</h3>
            </div>
            <div class="email-list" id="emailList">
                <!-- Emails will be loaded here -->
            </div>
        </div>
    </div>
    
    <!-- Upload Modal (File upload only - Paste Text removed) -->
    <div id="uploadModal" class="upload-modal" style="display: none;">
        <div class="upload-modal-content">
            <span class="upload-modal-close" onclick="closeUploadModal()">&times;</span>
            <h2 class="modal-title">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                Add Document
            </h2>
            
            <!-- File Upload (only tab now) -->
            <div class="tab-content" id="fileTab">
                <p class="upload-hint">Supported formats: PDF, DOCX, PPTX (max 50MB)</p>
                
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" accept=".pdf,.docx,.pptx" onchange="handleFileSelect(event)" style="display: none;">
                    <div class="upload-placeholder" onclick="document.getElementById('fileInput').click()">
                        <div class="upload-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
                                <path d="M12 12v9"/>
                                <path d="m16 16-4-4-4 4"/>
                            </svg>
                        </div>
                        <p>Click to select a file or drag and drop</p>
                    </div>
                </div>
                
                <div id="fileInfo" class="file-info" style="display: none;">
                    <p><strong>Selected:</strong> <span id="fileName"></span></p>
                    <p><strong>Size:</strong> <span id="fileSize"></span></p>
                </div>
                
                <div class="progress-container" id="progressContainer" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="upload-status" id="uploadStatus"></p>
                </div>
                
                <button id="uploadButton" class="upload-submit-btn" onclick="uploadFile()" disabled>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                    Upload Document
                </button>
            </div>
        </div>
    </div>
    
    <!-- Email Action Menu (Compact - Icon Only) -->
    <div id="emailActionModal" class="modal">
        <div class="modal-content icon-only">
            <div class="modal-actions">
                <button class="resume-btn icon-btn" onclick="confirmResumeEmail()" title="Summarize Email">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="/static/js/chat.js?v=9"></script>
</body>
</html>
