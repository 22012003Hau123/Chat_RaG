version: '3.8'

services:
  rag-chat:
    build: .
    container_name: rag-chat-app
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8000:7860"  # Map container port 7860 to host port 8000
    env_file:
      - .env
    volumes:
      - ./data:/app/data  # Persist data (optional)
      - ./logs:/app/logs  # Persist logs
      - ./image_cache:/app/image_cache  # Persist CLIP images and embeddings
      - ./static/images:/app/static/images # Persist uploaded images (optional)
    restart: always
